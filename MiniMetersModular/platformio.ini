; MiniMetersModular, ESP32-C6 Waveshare
; Build once, flash both identical boards with the same firmware.bin.
; Mesh control and viz frames use ESP-NOW on the Wi-Fi channel.

[platformio]
default_envs = waveshare_c6

[env:waveshare_c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DFIRMWARE_VERSION=\"1.4.1\"
	-DMMM_HEADLESS=0
	-DMMM_LED_PIN=8
	-DMMM_DEFAULT_ROLE=0
	-DMMM_PREFERRED_CONDUCTOR=0
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=0
lib_deps =
	ayushsharma82/ElegantOTA @ 3.1.7
	lovyan03/LovyanGFX @ ^1.2.0
	fastled/FastLED @ 3.9.15
; Default USB port — override when flashing the second board:
;   pio run -t upload --upload-port /dev/cu.usbmodem101
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

; Headless ESP32-S3 conductor. No SPI panel, so the display path stays off.
; Audio is the same UDP stream as the C6 until USB Audio Class is switched on.
;   pio run -e conductor_s3 -t upload
[env:conductor_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DFIRMWARE_VERSION=\"1.4.1\"
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=0
	-DMMM_HEADLESS=1
	-DMMM_LED_PIN=48
	-DMMM_DEFAULT_ROLE=1
	-DMMM_PREFERRED_CONDUCTOR=1
lib_deps =
	ayushsharma82/ElegantOTA @ 3.1.7
	lovyan03/LovyanGFX @ ^1.2.0
	fastled/FastLED @ 3.9.15

; Network OTA via ArduinoOTA (after Wi-Fi is up).
;   pio run -e ota -t upload --upload-port 192.168.1.224
[env:ota]
extends = env:waveshare_c6
upload_protocol = espota
upload_port = 192.168.1.224
upload_flags =
	--auth=modep
