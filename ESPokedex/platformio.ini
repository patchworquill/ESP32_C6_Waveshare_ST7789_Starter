
[platformio]
default_envs = esp32c6

[env:esp32c6]
platform = platformio/espressif32
board = esp32-c6-devkitm-1
framework = espidf

board_build.flash_size = 8MB

upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

monitor_speed = 115200
upload_speed = 460800

build_type = debug


